<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Via Nazionale — Galleria Foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0d0b;
      --surface: #161512;
      --surface2: #1e1c19;
      --border: rgba(255,255,255,0.07);
      --text: #e8e4dc;
      --text-muted: #7a7568;
      --accent: #c9a96e;
      --accent-dim: rgba(201,169,110,0.15);
      --radius: 4px;
      --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      padding: clamp(40px,6vw,80px) clamp(20px,4vw,48px) clamp(24px,4vw,48px);
      max-width: 900px;
    }

    .hero-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 5vw, 60px);
      font-weight: 300;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 16px;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-sub {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* ── COUNTER ── */
    .gallery-meta {
      padding: 0 clamp(20px,4vw,48px) 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .count-badge {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .count-badge span {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── GALLERY GRID ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 3px;
      padding: 0 clamp(20px,4vw,48px) clamp(40px,6vw,80px);
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface2);
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1), filter 0.4s ease;
      filter: brightness(0.92) saturate(0.9);
    }

    .thumb-wrap:hover img {
      transform: scale(1.06);
      filter: brightness(1) saturate(1.05);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(14,13,11,0.6) 0%, transparent 50%);
      opacity: 0;
      transition: opacity var(--transition);
      display: flex;
      align-items: flex-end;
      padding: 14px;
    }

    .thumb-wrap:hover .thumb-overlay { opacity: 1; }

    .thumb-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(201,169,110,0.2);
      border: 1px solid rgba(201,169,110,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }

    .thumb-icon svg { width: 14px; height: 14px; stroke: var(--accent); }

    /* skeleton */
    .thumb-wrap.loading { animation: shimmer 1.6s ease infinite; }
    @keyframes shimmer {
      0%,100% { background: var(--surface2); }
      50% { background: #252320; }
    }
    .thumb-wrap.loading img { opacity: 0; }

    /* ── MODAL ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(8,7,6,0.96);
      backdrop-filter: blur(4px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }

    .modal-img-wrap {
      position: relative;
      max-width: min(92vw, 1200px);
      max-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #modal-img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #modal-img.loaded { opacity: 1; }

    .modal-spinner {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-spinner.hidden { display: none; }

    /* modal controls */
    .modal-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: linear-gradient(to bottom, rgba(8,7,6,0.8), transparent);
    }

    .modal-counter {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .modal-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition);
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    .modal-close svg { width: 18px; height: 18px; stroke: var(--text); }

    .modal-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 0;
      width: 100%;
      padding: 0 16px;
      justify-content: space-between;
      pointer-events: none;
    }

    .nav-btn {
      pointer-events: all;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(14,13,11,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }
    .nav-btn:hover {
      background: rgba(201,169,110,0.15);
      border-color: rgba(201,169,110,0.3);
      transform: translateY(-50%) scale(1.08);
    }
    .nav-btn svg { width: 20px; height: 20px; stroke: var(--text); }
    #prev-btn { transform: translateY(-50%); }
    #next-btn { transform: translateY(-50%); }
    #prev-btn:hover { transform: translateY(-50%) scale(1.08); }
    #next-btn:hover { transform: translateY(-50%) scale(1.08); }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px clamp(20px,4vw,48px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-text {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 2px; padding: 0 12px 40px; }
      .hero { padding: 32px 16px 20px; }
      .gallery-meta { padding: 0 16px 20px; }
      footer { padding: 20px 16px; }
    }

    /* ── TOP BAR (logo only, no nav) ── */
    .gallery-topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px clamp(20px,4vw,48px) 0;
    }
    .gallery-topbar img {
      height: 32px;
      width: auto;
      opacity: 0.8;
    }
  </style>
</head>
<body>



<div class="gallery-topbar">
  <img src="https://www.dropbox.com/scl/fi/twyc4rahl03g0u8v1dyqa/logosample3.png?rlkey=tna8wqno4asvowhzla0oaklon&st=6zpq9nc3&raw=1" alt="Logo">
</div>
<section class="hero">
  <p class="hero-label">Galleria fotografica</p>
  <h1>Via Nazionale<br><em>Foto della struttura</em></h1>
  <p class="hero-sub">Scorri per esplorare gli spazi. Clicca su una foto per vederla in grande.</p>
</section>

<div class="gallery-meta">
  <p class="count-badge">Totale: <span id="total-count">0</span> foto</p>
</div>

<div class="gallery" id="gallery"></div>

<!-- MODAL -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Visualizzatore foto">
  <div class="modal-bar">
    <span class="modal-counter" id="modal-counter">1 / 1</span>
    <button class="modal-close" id="close-btn" aria-label="Chiudi">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-img-wrap">
    <div class="modal-spinner" id="spinner"></div>
    <img id="modal-img" alt="Foto ingrandita">
  </div>
  <div class="modal-nav">
    <button class="nav-btn" id="prev-btn" aria-label="Foto precedente">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <button class="nav-btn" id="next-btn" aria-label="Foto successiva">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
    </button>
  </div>
</div>

<footer>
  <span class="footer-text">Via Nazionale — Galleria generale</span>
  <span class="footer-text">© Dormilazzo</span>
</footer>

<script>
  // ── IMAGE DATA ──
  // All photos from all rooms, in order. Thumbnails from thumbnails/ folder.
  // NOTE: folder is "vianazioanle_camere" (typo in original — keep as-is)
  const THUMB_BASE  = 'thumbnails/vianazioanle_camere';
  const FULL_BASE   = 'vianazionale_camere';

  const rooms = {
    '101': [
      '20250110_112619.jpg','20250110_112718.jpg','20250110_112722.jpg','20250110_112728.jpg',
      '20250110_112756.jpg','20250110_112833.jpg','20250110_113757.jpg','20250110_114038.jpg',
      '20250110_114152.jpg','20250110_114210.jpg','20250110_114228.jpg','20250110_114246.jpg',
      '20250110_114302.jpg','20250110_114315.jpg','20250110_114352.jpg','20250110_114410.jpg'
    ],
    '102': [
      '20250110_120926.jpg','20250110_120959.jpg','20250110_121055.jpg','20250110_121101.jpg',
      '20250110_121251.jpg','20250110_121342.jpg','20250110_121403.jpg','20250110_121456.jpg',
      '20250110_121536.jpg','20250110_121610.jpg','20250110_121616(0).jpg','20250110_121629.jpg',
      '20250110_121812.jpg'
    ],
    '103': [
      '20250110_125254.jpg','20250110_125331.jpg','20250110_125353.jpg','20250110_125500.jpg',
      '20250110_125515.jpg','20250110_125526.jpg','20250110_125550.jpg','20250110_125602.jpg',
      '20250110_125616.jpg','20250110_125633.jpg','20250110_125730.jpg','20250110_125753.jpg',
      '20250110_125804.jpg','20250110_125824.jpg'
    ],
    '104': [
      '20250110_142958.jpg','20250110_143034.jpg','20250110_143109.jpg','20250110_143120.jpg',
      '20250110_143132.jpg','20250110_143143.jpg','20250110_143202.jpg','20250110_143216.jpg',
      '20250110_143235.jpg','20250110_143257.jpg','20250110_143319.jpg','20250110_143327.jpg',
      '20250110_143333.jpg','20250110_143348.jpg','20250110_143434.jpg','20250110_143523.jpg'
    ],
    '105': [
      '20250110_151206.jpg','20250110_151231.jpg','20250110_151256.jpg','20250110_151309.jpg',
      '20250110_151404.jpg','20250110_151417.jpg','20250110_151441.jpg','20250110_151518.jpg',
      '20250110_151655.jpg','20250110_151725.jpg'
    ],
    'breakfast': [
      '20250110_152604.jpg','20250110_152617.jpg','20250110_152634.jpg','20250110_152643.jpg',
      '20250110_152658.jpg','20250110_152711.jpg','20250110_152731.jpg','20250110_152805.jpg',
      '20250110_152816.jpg','20250110_152858.jpg','20250110_152925.jpg','20250110_153101.jpg',
      '20250110_153111.jpg'
    ]
  };

  // Flatten all images into one array for gallery + modal navigation
  const allImages = [];
  for (const [room, files] of Object.entries(rooms)) {
    for (const f of files) {
      allImages.push({
        thumb: `${THUMB_BASE}/${room}/${f}`,
        full:  `${FULL_BASE}/${room}/${f}`
      });
    }
  }

  // ── BUILD GALLERY ──
  const gallery = document.getElementById('gallery');
  document.getElementById('total-count').textContent = allImages.length;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const wrap = entry.target;
      const img  = wrap.querySelector('img');
      img.src = img.dataset.src;
      img.onload  = () => wrap.classList.remove('loading');
      img.onerror = () => wrap.classList.remove('loading');
      observer.unobserve(wrap);
    });
  }, { rootMargin: '300px' });

  allImages.forEach((item, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap loading';
    wrap.dataset.index = idx;

    const img = document.createElement('img');
    img.dataset.src = item.thumb;
    img.alt = `Foto ${idx + 1}`;

    const overlay = document.createElement('div');
    overlay.className = 'thumb-overlay';
    overlay.innerHTML = `<div class="thumb-icon"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803M10.5 7.5v6m3-3h-6"/></svg></div>`;

    wrap.appendChild(img);
    wrap.appendChild(overlay);
    wrap.addEventListener('click', () => openModal(idx));
    gallery.appendChild(wrap);
    observer.observe(wrap);
  });

  // ── MODAL ──
  const modal      = document.getElementById('modal');
  const modalImg   = document.getElementById('modal-img');
  const spinner    = document.getElementById('spinner');
  const counter    = document.getElementById('modal-counter');
  let currentIdx   = 0;

  function openModal(idx) {
    currentIdx = idx;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    loadModalImage(idx);
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    modalImg.classList.remove('loaded');
  }

  function loadModalImage(idx) {
    modalImg.classList.remove('loaded');
    spinner.classList.remove('hidden');
    counter.textContent = `${idx + 1} / ${allImages.length}`;
    const src = allImages[idx].full;
    modalImg.src = '';
    modalImg.src = src;
    modalImg.onload  = () => { spinner.classList.add('hidden'); modalImg.classList.add('loaded'); };
    modalImg.onerror = () => { spinner.classList.add('hidden'); };
    // preload adjacent
    [idx - 1, idx + 1].forEach(i => {
      if (i >= 0 && i < allImages.length) { const p = new Image(); p.src = allImages[i].full; }
    });
  }

  function navigate(dir) {
    currentIdx = (currentIdx + dir + allImages.length) % allImages.length;
    loadModalImage(currentIdx);
  }

  document.getElementById('close-btn').addEventListener('click', closeModal);
  document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
  document.getElementById('next-btn').addEventListener('click', () => navigate(1));

  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape')     closeModal();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  // touch swipe
  let touchX = 0;
  modal.addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
  modal.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].screenX - touchX;
    if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
  });
</script>
</body>
</html>
