<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiPA — Galleria Foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0d0b;
      --surface2: #1e1c19;
      --border: rgba(255,255,255,0.07);
      --text: #e8e4dc;
      --text-muted: #7a7568;
      --accent: #c9a96e;
      --radius: 4px;
      --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14,13,11,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px,4vw,48px);
      height: 64px;
    }

    .header-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
      transition: color var(--transition);
    }
    .header-back:hover { color: var(--accent); }
    .header-back svg { width: 16px; height: 16px; }

    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-logo img { height: 36px; width: auto; opacity: 0.9; }

    .hero {
      padding: clamp(40px,6vw,80px) clamp(20px,4vw,48px) clamp(24px,4vw,48px);
      max-width: 900px;
    }

    .hero-label {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px,5vw,60px);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero-sub { font-size: 14px; color: var(--text-muted); }

    .gallery-meta { padding: 0 clamp(20px,4vw,48px) 28px; }
    .count-badge { font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; }
    .count-badge span { color: var(--accent); font-weight: 500; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 3px;
      padding: 0 clamp(20px,4vw,48px) clamp(40px,6vw,80px);
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface2);
    }

    .thumb-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1), filter 0.4s ease;
      filter: brightness(0.92) saturate(0.9);
    }
    .thumb-wrap:hover img {
      transform: scale(1.06);
      filter: brightness(1) saturate(1.05);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(14,13,11,0.55) 0%, transparent 50%);
      opacity: 0;
      transition: opacity var(--transition);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 14px;
    }
    .thumb-wrap:hover .thumb-overlay { opacity: 1; }

    .thumb-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(201,169,110,0.2);
      border: 1px solid rgba(201,169,110,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-icon svg { width: 14px; height: 14px; stroke: var(--accent); }

    .thumb-wrap.loading { animation: shimmer 1.6s ease infinite; }
    @keyframes shimmer {
      0%,100% { background: var(--surface2); }
      50% { background: #252320; }
    }
    .thumb-wrap.loading img { opacity: 0; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(8,7,6,0.96);
      backdrop-filter: blur(4px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }

    .modal-img-wrap {
      position: relative;
      max-width: min(92vw,1200px);
      max-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #modal-img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #modal-img.loaded { opacity: 1; }

    .modal-spinner {
      position: absolute;
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-spinner.hidden { display: none; }

    .modal-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: linear-gradient(to bottom, rgba(8,7,6,0.85), transparent);
    }

    .modal-counter { font-size: 13px; color: var(--text-muted); letter-spacing: 0.06em; }

    .modal-close {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); }
    .modal-close svg { width: 18px; height: 18px; stroke: var(--text); }

    .modal-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      display: flex;
      width: 100%;
      padding: 0 16px;
      justify-content: space-between;
      pointer-events: none;
    }

    .nav-btn {
      pointer-events: all;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(14,13,11,0.7);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), border-color var(--transition);
    }
    .nav-btn:hover {
      background: rgba(201,169,110,0.15);
      border-color: rgba(201,169,110,0.3);
    }
    .nav-btn svg { width: 20px; height: 20px; stroke: var(--text); }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px clamp(20px,4vw,48px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-text { font-size: 12px; color: var(--text-muted); letter-spacing: 0.06em; }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: repeat(2,1fr); gap: 2px; padding: 0 12px 40px; }
      .hero { padding: 32px 16px 20px; }
      .gallery-meta { padding: 0 16px 20px; }
      footer { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="header-back">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
    Home
  </a>
  <span class="header-title">MiPA</span>
  <div class="header-logo">
    <img src="https://www.dropbox.com/scl/fi/twyc4rahl03g0u8v1dyqa/logosample3.png?rlkey=tna8wqno4asvowhzla0oaklon&st=6zpq9nc3&raw=1" alt="Logo">
  </div>
</header>

<section class="hero">
  <p class="hero-label">Galleria fotografica</p>
  <h1>MiPA<br><em>Foto degli appartamenti</em></h1>
  <p class="hero-sub">Scorri per esplorare gli spazi. Clicca su una foto per vederla in grande.</p>
</section>

<div class="gallery-meta">
  <p class="count-badge">Totale: <span id="total-count">0</span> foto</p>
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-bar">
    <span class="modal-counter" id="modal-counter">1 / 1</span>
    <button class="modal-close" id="close-btn" aria-label="Chiudi">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-img-wrap">
    <div class="modal-spinner" id="spinner"></div>
    <img id="modal-img" alt="Foto ingrandita">
  </div>
  <div class="modal-nav">
    <button class="nav-btn" id="prev-btn" aria-label="Precedente">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <button class="nav-btn" id="next-btn" aria-label="Successiva">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
    </button>
  </div>
</div>

<footer>
  <span class="footer-text">MiPA — Galleria generale</span>
  <span class="footer-text">© Dormilazzo</span>
</footer>

<script>
  const THUMB = 'thumbnails/MiPA';
  const FULL  = 'MiPA';

  // Paths assigned directly to img.src — browser handles raw filenames
  // including spaces and parentheses correctly this way.
  const APTS = {
    MiPA1: [
      '20250111_142153_result.jpg','20250111_142537_result.jpg','20250111_142554_result.jpg',
      '20250111_142557_result.jpg','20250111_142640_result.jpg','20250111_142748_result.jpg',
      '20250111_142759_result.jpg','20250111_142815_result.jpg','20250111_142829_result.jpg',
      '20250111_142905_result.jpg','20250111_142937_result.jpg','20250111_143031_result.jpg',
      '20250111_143039_result.jpg','20250111_143112_result.jpg','20250111_143127_result.jpg',
      '20250111_143137_result.jpg','20250111_143217_result.jpg','20250111_143306_result.jpg'
    ],
    MiPA2: [
      '20250111_151612_result.jpg','20250111_151622_result.jpg','20250111_151630_result.jpg',
      '20250111_151643_result.jpg','20250111_151659_result.jpg','20250111_151706_result.jpg',
      '20250111_151737_result.jpg','20250111_151803_result.jpg','20250111_151842_result.jpg',
      '20250111_151852(0)_result.jpg','20250111_151918_result.jpg','20250111_151924(0)_result.jpg',
      '20250111_151928_result.jpg','20250111_151950_result.jpg','20250111_152007_result.jpg',
      '20250111_152020_result.jpg','20250111_152024_result.jpg','20250111_152043_result.jpg',
      '20250111_152106_result.jpg',
      'photo_2023-09-10_18-10-25.jpg','photo_2023-09-10_18-15-14.jpg','photo_2023-09-10_18-25-44.jpg'
    ],
    MiPA3: [
      '20250111_144901_result.jpg','20250111_144916_result.jpg','20250111_144927_result.jpg',
      '20250111_144942_result.jpg','20250111_144948_result.jpg','20250111_145014_result.jpg',
      '20250111_145025_result.jpg','20250111_145032_result.jpg','20250111_145051_result.jpg',
      '20250111_145101_result.jpg','20250111_145115_result.jpg','20250111_145122_result.jpg',
      '20250111_145132_result.jpg','20250111_145203_result.jpg','20250111_145209_result.jpg',
      '20250111_145219_result.jpg','20250111_145226_result.jpg','20250111_145236_result.jpg',
      '20250111_145254_result.jpg'
    ],
    MiPA4: [
      'photo_2024-07-15_07-07-12.jpg',
      'photo_2024-07-15_07-07-12 (2).jpg','photo_2024-07-15_07-07-12 (3).jpg',
      'photo_2024-07-15_07-07-12 (4).jpg','photo_2024-07-15_07-07-12 (5).jpg',
      'photo_2024-07-15_07-07-13.jpg',
      'photo_2024-07-15_07-07-13 (2).jpg','photo_2024-07-15_07-07-13 (3).jpg',
      'photo_2024-07-15_07-07-13 (4).jpg','photo_2024-07-15_07-07-13 (5).jpg',
      'photo_2024-07-15_07-07-13 (6).jpg',
      'photo_2024-07-15_07-17-22.jpg'
    ]
  };

  const allImages = [];
  for (const [apt, files] of Object.entries(APTS)) {
    for (const f of files) {
      allImages.push({
        thumb: `${THUMB}/${apt}/${f}`,
        full:  `${FULL}/${apt}/${f}`
      });
    }
  }

  document.getElementById('total-count').textContent = allImages.length;

  const gallery = document.getElementById('gallery');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const wrap = entry.target;
      const img  = wrap.querySelector('img');
      if (!img.src && img.dataset.src) {
        img.src = img.dataset.src;
        img.onload  = () => wrap.classList.remove('loading');
        img.onerror = () => wrap.classList.remove('loading');
      }
      observer.unobserve(wrap);
    });
  }, { rootMargin: '400px' });

  allImages.forEach((item, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap loading';

    const img = document.createElement('img');
    img.dataset.src = item.thumb;
    img.alt = `Foto ${idx + 1}`;

    const overlay = document.createElement('div');
    overlay.className = 'thumb-overlay';
    overlay.innerHTML = `
      <div class="thumb-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803M10.5 7.5v6m3-3h-6"/>
        </svg>
      </div>`;

    wrap.appendChild(img);
    wrap.appendChild(overlay);
    wrap.addEventListener('click', () => openModal(idx));
    gallery.appendChild(wrap);
    observer.observe(wrap);
  });

  const modal    = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const spinner  = document.getElementById('spinner');
  const counter  = document.getElementById('modal-counter');
  let currentIdx = 0;

  function openModal(idx) {
    currentIdx = idx;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    loadImage(idx);
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    modalImg.classList.remove('loaded');
  }

  function loadImage(idx) {
    modalImg.classList.remove('loaded');
    spinner.classList.remove('hidden');
    counter.textContent = `${idx + 1} / ${allImages.length}`;
    modalImg.src = '';
    modalImg.src = allImages[idx].full;
    modalImg.onload  = () => { spinner.classList.add('hidden'); modalImg.classList.add('loaded'); };
    modalImg.onerror = () => { spinner.classList.add('hidden'); };
    [-1, 1].forEach(d => {
      const ni = idx + d;
      if (ni >= 0 && ni < allImages.length) { const p = new Image(); p.src = allImages[ni].full; }
    });
  }

  function navigate(dir) {
    currentIdx = (currentIdx + dir + allImages.length) % allImages.length;
    loadImage(currentIdx);
  }

  document.getElementById('close-btn').addEventListener('click', closeModal);
  document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
  document.getElementById('next-btn').addEventListener('click', () => navigate(1));
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape')     closeModal();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  let touchX = 0;
  modal.addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
  modal.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - touchX;
    if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
  });
</script>
</body>
</html>
