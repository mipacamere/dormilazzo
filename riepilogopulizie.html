    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f0f2f5, #e4e7eb);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1a202c;
            font-size: 28px;
            margin-bottom: 40px;
            font-weight: 700;
        }

        h2 {
            color: #2d3748;
            font-size: 20px;
            margin: 30px 0 20px;
            font-weight: 600;
            padding-left: 10px;
            border-left: 4px solid;
        }

        .archi h2 {
            border-color: #e53e3e;
        }

        .milazzo h2 {
            border-color: #2b6b74;
        }

        .room-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            transition: all 0.2s ease;
            background: #f7fafc;
        }

        .room-row.archi {
            border-left: 4px solid #e53e3e;
        }

        .room-row.milazzo {
            border-left: 4px solid #2b6b74;
        }

        .room-row:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .room-name {
            width: 120px;
            font-weight: 600;
            color: #2d3748;
            font-size: 16px;
        }

        select {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            flex: 1;
            transition: border-color 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: #4a5568;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .buttons {
            text-align: center;
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
        }

        button.pdf-btn {
            background: linear-gradient(90deg, #2b6cb0, #2c5282);
        }

        button.pdf-btn:hover {
            background: linear-gradient(90deg, #2c5282, #2b6cb0);
            transform: translateY(-1px);
        }

        button.image-btn {
            background: linear-gradient(90deg, #38a169, #2f855a);
        }

        button.image-btn:hover {
            background: linear-gradient(90deg, #2f855a, #38a169);
            transform: translateY(-1px);
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .status.success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }

        .status.error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .temp-container {
            position: absolute;
            left: -9999px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .room-row {
                flex-direction: column;
                gap: 10px;
            }

            .room-name {
                width: 100%;
                text-align: center;
            }

            select {
                width: 100%;
            }

            .buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

    <script>
        const { jsPDF } = window.jspdf;
        let roomData = {
            '101': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '102': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '103': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '104': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '105': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '201': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '202': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '203': { config: '', operation: '', extraBeds: '', section: 'Archi' },
            '1': { config: '', operation: '', extraBeds: '', section: 'Milazzo' },
            '2': { config: '', operation: '', extraBeds: '', section: 'Milazzo' },
            '3': { config: '', operation: '', extraBeds: '', section: 'Milazzo' },
            '4': { config: '', operation: '', extraBeds: '', section: 'Milazzo' }
        };

        function updateData() {
            for (let room in roomData) {
                roomData[room].config = document.getElementById(`config-${room}`).value;
                roomData[room].operation = document.getElementById(`operation-${room}`).value;
                const extraBedsElement = document.getElementById(`extra-beds-${room}`);
                roomData[room].extraBeds = extraBedsElement ? extraBedsElement.value : '';
            }
        }

        function getSelectedRooms() {
            let selectedRooms = [];
            for (let room in roomData) {
                if (roomData[room].config && roomData[room].operation) {
                    selectedRooms.push({
                        room: room,
                        config: roomData[room].config,
                        operation: roomData[room].operation,
                        extraBeds: roomData[room].extraBeds,
                        section: roomData[room].section
                    });
                }
            }
            return selectedRooms;
        }

        function generatePDF() {
            const selectedRooms = getSelectedRooms();

            if (selectedRooms.length === 0) {
                showStatus('Seleziona almeno una camera con configurazione e operazione', 'error');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('it-IT');
            const timeStr = now.toLocaleTimeString('it-IT');
            const fileName = `lista-attivita-${dateStr.replace(/\//g, '-')}.pdf`;

            const doc = new jsPDF();
            const pageHeight = doc.internal.pageSize.height;
            const margin = 20;
            let yPosition = margin;

            doc.setFont("Inter", "normal", 700);
            doc.setFontSize(16);
            doc.setTextColor(26, 32, 44);
            doc.text("ELENCO COSE DA FARE", margin, yPosition);
            yPosition += 10;

            doc.setFontSize(12);
            doc.setTextColor(45, 55, 72);
            doc.text(`Generato il ${dateStr} alle ${timeStr}`, margin, yPosition);
            yPosition += 10;

            doc.setLineWidth(0.5);
            doc.setDrawColor(226, 232, 240);
            doc.line(margin, yPosition, 190, yPosition);
            yPosition += 10;

            const sections = { 'Archi': [], 'Milazzo': [] };
            selectedRooms.forEach(room => {
                sections[room.section].push(room);
            });

            for (let section in sections) {
                if (sections[section].length > 0) {
                    if (yPosition > pageHeight - 30) {
                        doc.addPage();
                        yPosition = margin;
                    }

                    doc.setFontSize(14);
                    doc.setFont("Inter", "normal", 600);
                    doc.setTextColor(section === 'Archi' ? '#e53e3e' : '#2b6b74');
                    doc.text(section, margin, yPosition);
                    doc.setDrawColor(section === 'Archi' ? '#e53e3e' : '#2b6b74');
                    doc.line(margin - 5, yPosition - 2, margin - 5, yPosition + 2);
                    yPosition += 10;

                    sections[section].forEach((room, index) => {
                        if (yPosition > pageHeight - 30) {
                            doc.addPage();
                            yPosition = margin;
                        }

                        const configText = room.config === 'matrimoniale' ? 'Matrimoniale' : 'Due Lettini';
                        const operationText = room.operation === 'pulizia-completa' ? 'Pulizia Completa' : 'Cambio Spugne e Bagni';
                        const extraBedsText = room.extraBeds ? `${room.extraBeds} Letto/i Aggiuntivo/i` : '';
                        const text = `${index + 1}. Camera ${room.room}: ${configText}, ${operationText}${extraBedsText ? `, ${extraBedsText}` : ''}`;
                        doc.setFontSize(12);
                        doc.setFont("Inter", "normal", 400);
                        doc.setTextColor(45, 55, 72);
                        doc.text(text, margin, yPosition);
                        doc.setDrawColor(section === 'Archi' ? '#e53e3e' : '#2b6b74');
                        doc.line(margin - 5, yPosition - 4, margin - 5, yPosition + 2);
                        yPosition += 10;
                    });
                    yPosition += 5;
                }
            }

            if (yPosition > pageHeight - 30) {
                doc.addPage();
                yPosition = margin;
            }

            doc.setLineWidth(0.5);
            doc.setDrawColor(226, 232, 240);
            doc.line(margin, yPosition, 190, yPosition);
            yPosition += 10;

            doc.setFontSize(12);
            doc.setTextColor(45, 55, 72);
            doc.text(`Totale camere da gestire: ${selectedRooms.length}`, margin, yPosition);
            yPosition += 10;

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(`Hotel Management System - Lista Attività`, margin, yPosition);

            doc.save(fileName);
            showStatus(`Lista attività (PDF) generata con ${selectedRooms.length} camera/e!`, 'success');
        }

        function generateImage() {
            const selectedRooms = getSelectedRooms();

            if (selectedRooms.length === 0) {
                showStatus('Seleziona almeno una camera con configurazione e operazione', 'error');
                return;
            }

            // Crea un contenitore temporaneo
            const tempContainer = document.createElement('div');
            tempContainer.className = 'temp-container';
            document.body.appendChild(tempContainer);

            // Raggruppa le camere per sezione
            const sections = { 'Archi': [], 'Milazzo': [] };
            selectedRooms.forEach(room => {
                sections[room.section].push(room);
            });

            // Aggiungi le sezioni e le righe selezionate
            for (let section in sections) {
                if (sections[section].length > 0) {
                    // Aggiungi il titolo della sezione
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = section.toLowerCase();
                    sectionHeader.textContent = section;
                    tempContainer.appendChild(sectionHeader);

                    // Aggiungi le righe delle camere
                    sections[section].forEach(room => {
                        const roomRow = document.createElement('div');
                        roomRow.className = `room-row ${section.toLowerCase()}`;

                        const roomName = document.createElement('div');
                        roomName.className = 'room-name';
                        roomName.textContent = `Camera ${room.room}`;
                        roomRow.appendChild(roomName);

                        const configText = document.createElement('div');
                        configText.textContent = room.config === 'matrimoniale' ? 'Matrimoniale' : 'Due Lettini';
                        configText.style.padding = '10px 15px';
                        configText.style.flex = '1';
                        roomRow.appendChild(configText);

                        const operationText = document.createElement('div');
                        operationText.textContent = room.operation === 'pulizia-completa' ? 'Pulizia Completa' : 'Cambio Spugne e Bagni';
                        operationText.style.padding = '10px 15px';
                        operationText.style.flex = '1';
                        roomRow.appendChild(operationText);

                        if (room.extraBeds) {
                            const extraBedsText = document.createElement('div');
                            extraBedsText.textContent = `${room.extraBeds} Letto/i Aggiuntivo/i`;
                            extraBedsText.style.padding = '10px 15px';
                            extraBedsText.style.flex = '1';
                            roomRow.appendChild(extraBedsText);
                        }

                        tempContainer.appendChild(roomRow);
                    });
                }
            }

            // Genera l'immagine con html2canvas
            html2canvas(tempContainer, {
                scale: 2,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const image = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                const now = new Date();
                const dateStr = now.toLocaleDateString('it-IT').replace(/\//g, '-');
                link.href = image;
                link.download = `lista-attivita-${dateStr}.png`;
                link.click();
                showStatus(`Immagine PNG generata con ${selectedRooms.length} camera/e!`, 'success');
            }).catch(error => {
                console.error('Errore durante la generazione dell\'immagine:', error);
                showStatus('Errore durante la generazione dell\'immagine', 'error');
            }).finally(() => {
                // Rimuovi il contenitore temporaneo
                document.body.removeChild(tempContainer);
            });
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
